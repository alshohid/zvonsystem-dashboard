services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://192.168.7.42:4010/api}
        NEXT_PUBLIC_DESIGN_MODE: ${NEXT_PUBLIC_DESIGN_MODE:-true}
    image: zvonsystem-dashboard:latest
    container_name: zvonsystem-dashboard
    ports:
      - "3000:3000"
    restart: unless-stopped
